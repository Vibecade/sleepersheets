name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The edge function runs on Deno, so tsc never sees it. Without this
      # it was the one file in the repo with no type checking at all.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck edge functions
        run: npm run check:edge

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Enforce Bundle Budget
        run: npm run check:bundle

      - name: Route Smoke Checks
        run: npm run smoke:routes
