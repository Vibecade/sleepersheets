name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    # The migration folder had silently rotted to the point where it could not
    # build a database at all. A real Postgres is the only thing that catches
    # that, so CI gets one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # The edge function runs on Deno, so tsc never sees it. Without this
      # it was the one file in the repo with no type checking at all.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck edge functions
        run: npm run check:edge

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      - name: Enforce Bundle Budget
        run: npm run check:bundle

      - name: Route Smoke Checks
        run: npm run smoke:routes

      - name: Migrations Apply From Empty
        run: npm run check:migrations
